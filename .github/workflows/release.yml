name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test library, editor and camera protocol without hardware
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          FUJI_GUI_TESTS: '1'

  windows-msi:
    needs: tests
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify release tag matches the source version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Run this workflow from the v$version tag; release version must match pyproject.toml."
          }
          "IRO_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Set up Python and package Windows application
        shell: pwsh
        run: |
          ./setup.ps1
          ./build-msi.ps1 -InstallBuildTools
      - name: Verify package and generate checksum
        shell: pwsh
        run: |
          $msi = "dist/Iro-$env:IRO_RELEASE_VERSION-x64.msi"
          if (-not (Test-Path -LiteralPath $msi)) { throw 'MSI was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content -Encoding ascii "$msi.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Iro-windows-x64
          path: |
            dist/Iro-*.msi
            dist/Iro-*.msi.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:IRO_RELEASE_VERSION"
          gh release create $tag "dist/Iro-$env:IRO_RELEASE_VERSION-x64.msi" "dist/Iro-$env:IRO_RELEASE_VERSION-x64.msi.sha256" --verify-tag --title "Iro $tag" --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
